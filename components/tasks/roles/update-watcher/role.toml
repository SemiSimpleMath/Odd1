# The update-watcher role. Edit freely; the runner rereads this file before each task (no rebuild needed).
enabled = true            # false: the runner takes no new tasks for this role (paused)
tags = ["updates"]        # it claims only tasks whose every tag is in this list
runs_per_day = 2          # at most this many runs in any 24 hours
max_turns = 30            # cap on any task's turn budget
max_minutes = 10          # cap on any task's time budget
model = ""                # empty: Claude Code's default model

[[starter]]               # created once as proposed; after `odd1-tasks approve ID` a new run starts every day
goal = "Today's installed and available versions are compared and each available update is proposed as a task."
done_when = "test -s reports/$(date +%F).md"
schedule = "1d"
