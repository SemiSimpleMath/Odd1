# The worker role: runs the cron manager's routines (routines/), any of them, handed each one's skill and permissions.
# Edit freely (or in Agent Settings); the runner rereads this file before each task (no rebuild needed).
enabled = true            # false: the runner takes no new tasks for this role (paused)
tags = ["routine"]        # plus routine-<name> for every routine (all_routines)
all_routines = true
runs_per_day = 6          # at most this many runs in any 24 hours, all routines together
max_turns = 60            # cap on any task's turn budget
max_minutes = 30          # cap on any task's time budget
model = ""                # empty: Claude Code's default model
