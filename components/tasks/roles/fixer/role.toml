# The fixer role: works approved friction tickets, one at a time, each on its own git branch, and lands the fix.
# Edit freely (or in the Agents app); the runner rereads this file before each task (no rebuild needed).
enabled = true            # false: the runner takes no new tasks for this role (paused)
tags = ["friction"]       # plus a tag for every component (all_components), as tickets carry their component's name
all_components = true
workspace = "git-worktree"   # each task on branch task/<id> in its own worktree, made from main
review = true             # the reviewer role reads each branch before it lands (odd1-tasks-land)
runs_per_day = 1          # starts careful (it changes the system): raise it once you trust its fixes
max_turns = 80            # cap on any task's turn budget
max_minutes = 30          # cap on any task's time budget (a system build is part of it)
model = ""                # empty: Claude Code's default model
