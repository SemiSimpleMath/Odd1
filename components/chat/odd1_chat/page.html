<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #141827; --bubble: #1e2438; --mine: #2b3a5c; --text: #e6e8f0; --dim: #8b92aa; --rim: #262c44;
    --accent: #e8805f; --allow: #3f8f5f; --deny: #3a3f55; --code: #0f1220;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14.5px/1.55 Inter, sans-serif; padding: 18px 18px 28px; }
  #log { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; background: var(--bubble); overflow-wrap: anywhere; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; }
  .msg.claude { align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.live::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg h1, .msg h2, .msg h3 { font-size: 15px; margin: 10px 0 6px; }
  .msg code { font: 12.5px "JetBrains Mono", monospace; background: var(--code); padding: 1px 5px; border-radius: 5px; }
  .msg pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
  .msg pre code { padding: 0; background: none; }
  .msg table { border-collapse: collapse; margin: 6px 0; } .msg td, .msg th { border: 1px solid var(--rim); padding: 3px 8px; }
  .msg a { color: #8cc2f7; }
  details.code > summary { cursor: pointer; color: var(--dim); font-size: 12.5px; list-style: none; margin: 4px 0; }
  details.code > summary::before { content: "▸ "; } details.code[open] > summary::before { content: "▾ "; }
  .msg img.pasted { max-width: 220px; max-height: 160px; border-radius: 8px; display: block; margin-bottom: 6px; }
  .tool { align-self: flex-start; color: var(--dim); font-size: 12.5px; padding: 0 6px; }
  .tool::before { content: "· "; }
  .card { align-self: stretch; background: var(--bubble); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; }
  .card .what { font-weight: 600; margin-bottom: 10px; }
  .card .target { font: 12.5px "JetBrains Mono", monospace; color: var(--text); background: var(--code); border-radius: 8px;
                  padding: 8px 10px; margin: -2px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow-y: auto; }
  .card .target:empty { display: none; }
  .card button { font: 600 13px Inter, sans-serif; color: var(--text); border: 0; border-radius: 8px; padding: 7px 16px; margin-right: 8px; cursor: pointer; }
  .card button.allow { background: var(--allow); } .card button.deny { background: var(--deny); }
  .card.answered { border-color: var(--rim); } .card.answered .buttons { display: none; }
  .card .verdict { color: var(--dim); font-size: 12.5px; }
  .note { align-self: center; color: var(--dim); font-size: 12.5px; }
  .note.error { color: var(--accent); }
  #empty { color: var(--dim); text-align: center; margin-top: 30vh; font-size: 15px; }
</style>
</head>
<body>
<div id="empty">Ask Claude anything. Paste a picture with Ctrl+V.</div>
<div id="log"></div>
<script>
  const log = document.getElementById("log");
  let live = null, liveText = "";
  const post = (obj) => window.webkit.messageHandlers.odd1.postMessage(JSON.stringify(obj));
  function bottom() { window.scrollTo(0, document.body.scrollHeight); }
  function el(cls, html) {
    document.getElementById("empty")?.remove();
    const node = document.createElement("div"); node.className = cls; node.innerHTML = html;
    log.appendChild(node); bottom(); return node;
  }
  function mine(html) { el("msg mine", html); }
  function delta(text) {
    if (!live) { live = el("msg claude live", ""); liveText = ""; }
    liveText += text; live.textContent = liveText; bottom();
  }
  function reply(html) {
    if (live) { live.classList.remove("live"); live.innerHTML = html; live = null; } else { el("msg claude", html); }
    bottom();
  }
  function tool(text) { if (live) { live.classList.remove("live"); live = null; } el("tool", text).textContent = text; }
  function note(text, error) { const n = el("note" + (error ? " error" : ""), ""); n.textContent = text; }
  function permission(id, what, detail) {
    const card = el("card", '<div class="what"></div><div class="target"></div>' +
      '<div class="buttons"><button class="allow">Allow</button><button class="deny">Deny</button></div>' +
      '<div class="verdict"></div>');
    card.id = "p-" + id;
    card.querySelector(".what").textContent = what;
    card.querySelector(".target").textContent = detail;
    card.querySelector(".allow").onclick = () => post({answer: id, allow: true});
    card.querySelector(".deny").onclick = () => post({answer: id, allow: false});
  }
  function answered(id, allowed) {
    const card = document.getElementById("p-" + id); if (!card) return;
    card.classList.add("answered"); card.querySelector(".verdict").textContent = allowed ? "Allowed" : "Declined";
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a"); if (a) { e.preventDefault(); post({open: a.href}); }
  });
</script>
</body>
</html>
